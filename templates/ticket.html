{% extends "base.html" %}

{% block title %}Ticket #{{ ticket.number }} · QueuExpress{% endblock %}

{% block content %}
  <h2>Ticket #{{ ticket.number }}</h2>
  <p>Service: {{ service_name }}</p>
  <p>Status: <span class="status status-{{ ticket.status }}">{{ ticket.status }}</span></p>
  <p>People ahead of you: {{ ahead }}</p>
  <p><a href="{{ url_for('index') }}">&larr; Back to home</a></p>
{% endblock %}
